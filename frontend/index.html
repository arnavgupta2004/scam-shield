<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scam Shield</title>
  <meta name="description" content="Check a suspicious message or call in English, Hindi or Kannada.">
  <meta name="theme-color" content="#14213D">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Kannada:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" alt="" width="36" height="36">
      <span data-t="appName">Scam Shield</span>
    </div>
    <nav class="langs" aria-label="Language">
      <button type="button" data-lang="en" lang="en">English</button>
      <button type="button" data-lang="hi" lang="hi">हिन्दी</button>
      <button type="button" data-lang="kn" lang="kn">ಕನ್ನಡ</button>
    </nav>
  </header>

  <main>
    <!-- Home -->
    <section id="screen-home" class="screen" aria-labelledby="home-title">
      <h1 id="home-title" data-t="title"></h1>
      <p class="lead" data-t="intro"></p>

      <label for="msg" class="visually-hidden" data-t="placeholder"></label>
      <textarea id="msg" rows="6" maxlength="4000" data-t-placeholder="placeholder"></textarea>

      <div class="row">
        <button type="button" class="btn btn-quiet mic" data-mic="msg" aria-pressed="false">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12h-2Z"/></svg>
          <span data-t="speak"></span>
        </button>
        <button type="button" id="btn-check" class="btn btn-primary" data-t="check"></button>
      </div>

      <!-- hidden file picker — triggered by btn-ocr -->
      <input type="file" id="ocr-input" accept="image/*" class="visually-hidden" aria-hidden="true" tabindex="-1">
      <button type="button" id="btn-ocr" class="btn btn-quiet btn-wide ocr-btn">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4h4V2H2v6h2V4Zm16 0v4h2V2h-6v2h4Zm0 16h-4v2h6v-6h-2v4ZM8 20H4v-4H2v6h6v-2ZM8 8h8v8H8z"/></svg>
        <span data-t="ocrBtn"></span>
      </button>
      <p id="ocr-progress" class="ocr-progress" aria-live="polite" hidden></p>
      <p class="error" id="home-error" role="alert" hidden></p>

      <!-- Family number setting (saved only on this phone) -->
      <div class="family-setting" id="family-setting">
        <label for="setting-family-phone" class="family-setting-label" data-t="familySettingLabel"></label>
        <div class="family-setting-row">
          <input type="tel" id="setting-family-phone" inputmode="tel" autocomplete="tel" maxlength="16" data-t-placeholder="familySettingPlaceholder">
          <span id="family-setting-saved" class="family-setting-saved" aria-live="polite" hidden data-t="familySettingSaved"></span>
        </div>
      </div>

      <button type="button" id="btn-call" class="callstrip">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1l-2.2 2.2Z"/></svg>
        <span>
          <strong data-t="callBtn"></strong>
          <span data-t="callSub"></span>
        </span>
      </button>

      <p class="privacy">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Z"/></svg>
        <span data-t="privacy"></span>
      </p>
    </section>

    <!-- Live call coach -->
    <section id="screen-coach" class="screen" aria-labelledby="coach-title" hidden>
      <button type="button" class="link back" data-go="home" data-t="back"></button>
      <h1 id="coach-title" data-t="coachTitle"></h1>
      <p class="lead" data-t="coachHint"></p>
      <div class="cues" id="cues" role="group" aria-labelledby="coach-title"></div>

      <label for="coach-msg" class="field-label" data-t="coachMore"></label>
      <div class="row row-tight">
        <textarea id="coach-msg" rows="2" maxlength="1000"></textarea>
        <button type="button" class="btn btn-quiet mic mic-square" data-mic="coach-msg" aria-pressed="false">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12h-2Z"/></svg>
          <span class="visually-hidden" data-t="speak"></span>
        </button>
      </div>
      <button type="button" id="btn-coach" class="btn btn-alarm btn-wide" data-t="coachGo"></button>
      <p class="error" id="coach-error" role="alert" hidden></p>
    </section>

    <!-- Checking -->
    <p id="mic-status" role="status" aria-live="polite" class="visually-hidden"></p>

    <section id="screen-wait" class="screen wait" hidden aria-live="polite">
      <div class="pulse" aria-hidden="true"></div>
      <p data-t="checking"></p>
    </section>

    <!-- Verdict -->
    <section id="screen-verdict" class="screen" hidden>
      <div class="verdict" id="verdict-band" tabindex="-1">
        <span class="verdict-icon" aria-hidden="true"></span>
        <h1 id="verdict-title"></h1>
      </div>

      <p class="advice-now" id="advice-now" hidden></p>
      <p class="explanation" id="explanation"></p>

      <div id="flags-block" hidden>
        <h2 data-t="whyTitle"></h2>
        <ul id="flags"></ul>
      </div>

      <div id="advice-block">
        <h2 data-t="doTitle"></h2>
        <p id="advice"></p>
      </div>

      <p class="note" id="offline-note" data-t="offlineNote" hidden></p>

      <div class="actions">
        <button type="button" class="btn btn-quiet" id="btn-read" data-t="readAloud"></button>
        <a class="btn btn-call-family" id="btn-call-family" data-t="callFamily" hidden></a>
        <a class="btn btn-alarm" id="btn-1930" href="tel:1930" data-t="call1930" hidden></a>
        <button type="button" class="btn btn-primary" id="btn-alert" data-t="alertFamily"></button>
        <button type="button" class="btn btn-quiet" id="btn-report" data-t="report"></button>
        <button type="button" class="btn btn-quiet" id="btn-again" data-t="again"></button>
      </div>

      <p class="error" id="verdict-error" role="alert" hidden></p>

      <div id="report-block" class="panel" hidden aria-live="polite">
        <h2 data-t="report"></h2>
        <p id="report-steps" class="pre"></p>
      </div>

      <details class="sent">
        <summary data-t="sentTitle"></summary>
        <p id="sent-text" class="pre"></p>
      </details>
    </section>
  </main>

  <!-- Confirmation before any family alert (human in the loop) -->
  <dialog id="confirm" aria-labelledby="confirm-title" aria-modal="true">
    <form id="confirm-form">
      <h2 id="confirm-title" data-t="confirmTitle"></h2>
      <p data-t="confirmBody"></p>
      <label for="family-phone" class="field-label" data-t="phoneLabel"></label>
      <input id="family-phone" type="tel" inputmode="tel" autocomplete="off" maxlength="16">
      <div class="dialog-actions">
        <button type="button" class="btn btn-quiet" id="confirm-no" data-t="cancel"></button>
        <button type="button" class="btn btn-primary" id="confirm-yes" data-t="confirmYes"></button>
      </div>
    </form>
  </dialog>

  <dialog id="alert-ready" aria-labelledby="ready-title" aria-modal="true">
    <h2 id="ready-title" data-t="alertReady"></h2>
    <p id="alert-text" class="quote"></p>
    <div class="dialog-actions stack">
      <a class="btn btn-primary" id="send-wa" target="_blank" rel="noopener" data-t="sendWhatsApp"></a>
      <a class="btn btn-quiet" id="send-sms" data-t="sendSms"></a>
      <button type="button" class="btn btn-quiet" id="ready-close" data-t="close"></button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" crossorigin="anonymous"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
